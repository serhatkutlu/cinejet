okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

#Serialization
kotlinx-serialization-core-jvm = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core-jvm", version.ref = "kotlinxSerializationCoreJvm" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }


#Detekt
detekt = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

#build-logic
android-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
